name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 升级 npm（Trusted Publisher 需要 11.5.1 以上）
        run: npm install -g npm@11

      - name: 核对 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag ($TAG) 与 package.json 版本 ($VER) 不一致"
            exit 1
          fi

      - name: 跑自测
        run: node test/smoke.test.js

      - name: 发布到 npm
        run: npm publish --access public --provenance
